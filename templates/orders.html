{% extends "base.html" %} {% block content %}

<div class="top">
  <div>
    <h1>Current Orders</h1>

    <p>Track and manage orders currently in transit or processing.</p>
  </div>

  <button onclick="window.location.href = '/orders/new'">+ Add Order</button>
</div>

<div class="search">
  <input type="text" placeholder="Search orders..." />
  <button>Search</button>
</div>

<div class="status-tabs" id="statusTabs" role="tablist">
  <button class="status-tab active" data-status="All" role="tab" aria-selected="true">
    All <span class="tab-count" id="countAll">0</span>
  </button>
  <button class="status-tab" data-status="Pending" role="tab" aria-selected="false">
    Pending <span class="tab-count" id="countPending">0</span>
  </button>
  <button class="status-tab" data-status="In Transit" role="tab" aria-selected="false">
    In Transit <span class="tab-count" id="countInTransit">0</span>
  </button>
  <button class="status-tab" data-status="Delivered" role="tab" aria-selected="false">
    Delivered <span class="tab-count" id="countDelivered">0</span>
  </button>
  <button class="status-tab" data-status="Canceled" role="tab" aria-selected="false">
    Cancelled <span class="tab-count" id="countCanceled">0</span>
  </button>
</div>

<table id="ordersTable">
  <thead>
    <tr>
      <th>Order #</th>
      <th>Material</th>
      <th>Quantity</th>
      <th>Supplier</th>
      <th>Est. Arrival</th>
      <th>Required By</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="ordersTableBody">
  </tbody>
</table>

{% endblock %}{% block scripts %}
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}
