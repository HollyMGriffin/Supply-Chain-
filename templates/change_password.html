{% extends "base.html" %} {% block content %}

<h1>Change Password</h1>
<p>Enter your current password, then choose a new one.</p>

<div class="order-form">
  <form id="passwordForm">
    <label for="currentPassword">Current Password</label>
    <input type="password" id="currentPassword" autocomplete="current-password" required />

    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" autocomplete="new-password" required />

    <label for="confirmPassword">Confirm New Password</label>
    <input type="password" id="confirmPassword" autocomplete="new-password" required />

    <p id="passwordError" class="form-error"></p>
    <p id="passwordMessage" class="form-success"></p>

    <div class="form-buttons">
      <button type="button" class="cancel-button" id="cancelPasswordButton">
        Cancel
      </button>

      <button type="submit">Change Password</button>
    </div>
  </form>
</div>

{% endblock %}{% block scripts %}
<script src="{{ url_for('static', filename='js/change_password.js') }}"></script>
{% endblock %}
