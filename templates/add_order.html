{% extends "base.html" %} {% block content %}

<h1>Add New Order</h1>
<p>Input a new material supply order into the tracking system.</p>

<div class="order-form">
  <h3>Order Specifications</h3>

  <label>Material</label>
  <select id="material" required><option value="">Loading warehouse inventory...</option></select>
  <p id="stockInfo" aria-live="polite"></p>

  <label>Quantity</label>
  <input type="number" id="quantity" placeholder="Enter quantity" />

  <label>Estimated Arrival Date</label>
  <input type="date" id="arrival" />

  <label>Required By Date</label>
  <input type="date" id="required" />

  <div class="form-buttons">
    <button class="cancel-button" id="cancelOrderButton">
      Cancel
    </button>

    <button id="saveOrderButton">Save Order</button>
  </div>
</div>

{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/order_form.js') }}"></script>
{% endblock %}
