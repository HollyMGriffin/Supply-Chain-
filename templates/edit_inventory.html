
{% extends "base.html" %}

{% block content %}

<div class="inventory-page">

    <h1>Edit Inventory</h1>
    <p>Update an existing material in the warehouse.</p>

    <div class="order-form">
        <form id="inventory-form">

            <label for="material">Material</label>
            <input
                    type="text"
                    id="material"
                    name="material"
                    required
            >

            <label for="quantity">Quantity</label>
            <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="0"
                    step="1"
                    required
            >

            <label for="location">Warehouse Location</label>
            <input
                    type="text"
                    id="location"
                    name="location"
                    required
            >

            <label for="cost">Cost per Unit ($)</label>
            <input
                    type="number"
                    id="cost"
                    name="cost"
                    min="0"
                    step="0.01"
                    required
            >

            <p id="inventory-error" style="color: red;"></p>

            <div class="form-buttons">
                <button
                        type="button"
                        class="cancel-button"
                        onclick="window.location.href='/inventory'">
                    Cancel
                </button>

                <button type="submit">Save Changes</button>
            </div>

        </form>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/edit_inventory.js') }}"></script>
{% endblock %}
