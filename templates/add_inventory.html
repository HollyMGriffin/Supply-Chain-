
{% extends "base.html" %}

{% block content %}

<div class="inventory-page">

    <h1>Add Inventory</h1>
    <p>Add a material currently stored in the warehouse.</p>

    <div class="order-form">
        <form id="inventory-form">

            <label for="material">Material</label>
            <input
                    type="text"
                    id="material"
                    name="material"
                    placeholder="Example: Steel Beams"
                    required
            >

            <label for="quantity">Quantity</label>
            <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="0"
                    step="1"
                    placeholder="Example: 450"
                    required
            >

            <label for="location">Warehouse Location</label>
            <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Example: A1"
                    required
            >

            <label for="cost">Cost per Unit ($)</label>
            <input
                    type="number"
                    id="cost"
                    name="cost"
                    min="0"
                    step="0.01"
                    placeholder="Example: 25.00"
                    required
            >

            <p id="inventory-error" class="form-error"></p>

            <div class="form-buttons">
                <button type="button" class="cancel-button"
                        id="cancelInventoryButton">
                    Cancel
                </button>

                <button type="submit">Save Inventory</button>
            </div>

        </form>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/inventory_form.js') }}"></script>
{% endblock %}
